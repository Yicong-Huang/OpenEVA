# Slack channel manifest. Loaded by `core.channels.discover_dir` on
# first boot; values under `settings:` are seeded into the settings DB
# under `channel.slack.<key>`. Existing DB rows win, so user edits via
# the Settings UI survive a re-seed.

id: slack
name: Slack
enabled: true

settings:
  # Optional workspace base URL for permalinks
  # (e.g. https://your-team.slack.com). Empty -> events skip the url
  # field.
  workspace_url: ""

  # Default empty -- channels are usually added via the Settings UI
  # (/api/slack-monitor/channels). The first-boot yaml seeder in
  # core.settings still recognises `slack_monitor.channels` for
  # back-compat.
  channels: []
